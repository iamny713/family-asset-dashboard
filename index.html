<!doctype html>
<html lang="ko">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="referrer" content="strict-origin-when-cross-origin" /><title>노유킹네 집 가계부 프로그램</title></head>
  <body>
<header><div><div class="brand"><span class="brand-mark" aria-hidden="true">₩</span><strong>노유킹네 집 가계부 프로그램</strong></div><button type="button" id="refresh">새로고침</button></div></header>
<main>
<p id="refresh-status" class="muted" role="status" hidden></p>
<div id="dashboard-content">
<nav class="menu" aria-label="주 메뉴">
<button type="button" data-view="overview" aria-current="page">대시보드</button>
<button type="button" data-view="monthly">수입/지출 관리</button>
<button type="button" data-view="salary">내 소득</button>
<button type="button" data-view="holdings">자산별</button>
<button type="button" data-view="debts">부채 관리</button>
</nav>
<div class="row filters"><div><h1>대시보드</h1><small>공유 원장 · 조회 전용</small></div><label>조회 월 <input id="month" type="month"></label></div>
<div id="overview">
<section class="metrics" id="totals" aria-label="월별 요약"></section>
<section class="panel"><div class="row asset-scope"><h2 id="total-asset-title">월별 총자산 추이</h2><label class="asset-switch"><input id="portfolio-include-property" type="checkbox" role="switch" aria-controls="totals total-asset-trend allocation" checked><span class="asset-switch-track" aria-hidden="true"></span>부동산 포함</label></div><div id="total-asset-trend"></div><dl id="total-asset-context"></dl></section>
<div class="columns"><section class="panel"><h2>자산 포트폴리오</h2><div id="allocation"></div></section><section class="panel"><h2>월간 현금흐름</h2><div id="flow-chart"></div></section></div>
<div class="columns"><section class="panel"><h2>사람별 수입·지출</h2><dl id="people"></dl></section><section class="panel"><h2>분류별 수입·지출</h2><dl id="categories"></dl></section></div>
</div>
<div id="monthly" hidden>
<section class="panel"><h2>월별 수입·지출 추이</h2><div id="cashflow-trend"></div></section>
<section class="panel"><h2>월별 특이사항</h2><div class="monthly-notes">
<div class="monthly-note" data-kind="income"><h3>수입 특이사항</h3><p id="income-note"></p></div>
<div class="monthly-note" data-kind="expense"><h3>지출 특이사항</h3><p id="expense-note"></p></div>
</div></section>
<section class="panel"><h2>수입·지출 비교</h2><div id="monthly-flow"></div></section>
<section class="panel"><h2>수입·지출 내역</h2><div id="entries"></div></section>
</div>
<div id="salary" hidden>
<section class="panel"><h2>유한 월별 소득 추이 · 6개월</h2><div id="personal-income-trend"></div><dl id="personal-income-summary" class="asset-metrics"></dl></section>
<section class="panel"><h2>유한 연간 소득</h2><div id="personal-income-annual"></div></section>
<section class="panel"><h2>유한 월별 급여 추이</h2><div id="salary-trend"></div><dl id="salary-summary" class="asset-metrics"></dl></section>
<section class="panel"><h2>급여명세서</h2>
<p id="payroll-status" role="status"></p>
<h3>월별 초과근무수당 · 6개월</h3><div id="payroll-overtime"></div>
<h3>월별 공제액 · 6개월</h3><div id="payroll-deductions"></div>
<section id="payroll-details" hidden aria-live="polite"></section>
</section>
</div>
<div id="holdings" hidden><div id="asset-trends" class="asset-trends"></div>
<section class="panel"><h2>전월 대비 자산 변동</h2><div id="monthly-delta"></div></section>
<section class="panel"><h2>자산 변경 내역</h2><div id="changes"></div></section>
</div>
<div id="debts" hidden>
<section class="panel"><h2>부채 잔액</h2><div id="debt-balances" class="debt-values" role="group" aria-label="조회 월 부채별 잔액 막대차트"></div></section>
<section class="panel"><h2>월별 총부채 추이</h2><div id="debt-trend" class="debt-values"></div></section>
<section class="panel"><h2>전월 대비 부채 변동</h2><div id="monthly-debt-delta" class="debt-values"></div></section>
<section class="panel"><h2>부채 변경 이력</h2><dl id="debt-history" class="debt-values"></dl></section>
</div>
</div>
</main>
<script type="module" src="/src/main.ts"></script>
  </body>
</html>
